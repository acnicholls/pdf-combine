# This script builds the end user installer for Folder Size Calculator
# and then uses the installed to build the portal binaries
# the portal binaries are them compressed and uploaded to the
# github action as output.
name: build-release-binaries
run-name: Release build for ${{ github.event_name }} triggered by ${{ github.triggering_actor }}
concurrency:
  group: release-binaries
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
env:
  BUILD_TYPE: Release
  ENDUSER_INSTALLER_FILE_NAME: pdf-combine-setup.msi
jobs:
  build-release-binaries:
    runs-on: windows-latest
    outputs:
      build-type: ${{ steps.get-build-type.outputs.build-type }}
      installer-filename: ${{ steps.get-installer-filename.outputs.installer-filename }}
    steps:
      - id: get-build-type
        shell: powershell
        run: echo "build-type=${{ env.BUILD_TYPE }}" >> $env:GITHUB_OUTPUT
      - id: get-installer-filename
        shell: powershell
        run: echo "installer-filename=${{ env.ENDUSER_INSTALLER_FILE_NAME }}" >> $env:GITHUB_OUTPUT

      # get the latest code from the repo
      - name: Checkout Code
        uses: actions/checkout@v6

      # add msbuild and devenv to the PATH variable
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup VS Dev Environment
        id: setup-vsdev
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      # display environment variables, for audit purposes
      - name: Check Environment
        run: |
          dir env:

      # setup nuget executable
      - name: setup Nuget
        id: setup-nuget
        uses: nuget/setup-nuget@v2

      # restore nuget dependencies
      - name: run nuget restore
        id: run-nuget-restore
        working-directory: .
        run: nuget restore .\pdf-combine.sln

      # builds the custom-installer and user-interface before it's own cab
      - name: Install VS Installer Projects extension
        id: install-vs-installer-projects
        shell: powershell
        continue-on-error: true
        env:
          VS_DEV_ROOT: ${{ steps.setup-vsdev.outputs.install-path }}
        run: |
          $vsixUrl = 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/VisualStudioClient/vsextensions/MicrosoftVisualStudio2017InstallerProjects/latest/vspackage'
          $vsixPath = "$PWD\InstallerProjects.vsix"
          Write-Host "Downloading VSIX from $vsixUrl"
          try {
            Invoke-WebRequest -Uri $vsixUrl -OutFile $vsixPath -UseBasicParsing -ErrorAction Stop
            Write-Host "Downloaded VSIX to $vsixPath"
          } catch {
            Write-Warning "Failed to download VSIX: $_"
            exit 0
          }
          $installed = $false
          if ($env:VS_DEV_ROOT) {
            $candidate = Join-Path $env:VS_DEV_ROOT 'Common7\IDE\VSIXInstaller.exe'
            Write-Host "Using VS root from previous step: $env:VS_DEV_ROOT"
            if (Test-Path $candidate) {
              Write-Host "Found VSIX installer at $candidate. Installing..."
              & $candidate $vsixPath /q
              if ($LASTEXITCODE -eq 0) { Write-Host "Installed extension via $candidate"; $installed = $true }
              else { Write-Warning "VSIXInstaller returned exit code $LASTEXITCODE" }
            } else { Write-Warning "VSIXInstaller not found at $candidate" }
          }
          if (-not $installed) {
            $vswhereCmd = $null
            $cmdObj = Get-Command vswhere.exe -ErrorAction SilentlyContinue
            if ($cmdObj) { $vswhereCmd = $cmdObj.Source }
            elseif (Test-Path 'C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe') { $vswhereCmd = 'C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe' }
            if ($vswhereCmd) {
              Write-Host "Found vswhere at $vswhereCmd. Querying for latest installation."
              try {
                $json = & $vswhereCmd -latest -products * -format json 2>$null
                if ($json) {
                  $insts = $json | ConvertFrom-Json
                  if ($insts -is [System.Array]) { $inst = $insts[0] } else { $inst = $insts }
                  $installPath = $inst.installationPath
                  if ($installPath) {
                    $candidate = Join-Path $installPath 'Common7\\IDE\\VSIXInstaller.exe'
                    if (Test-Path $candidate) {
                      Write-Host "Found VSIX installer at $candidate. Installing..."
                      & $candidate $vsixPath /q
                      if ($LASTEXITCODE -eq 0) { Write-Host "Installed extension via vswhere path"; $installed = $true }
                      else { Write-Warning "VSIXInstaller returned exit code $LASTEXITCODE" }
                    } else { Write-Warning "VSIXInstaller not found at $candidate" }
                  } else { Write-Warning "vswhere did not return installationPath" }
                } else { Write-Warning "vswhere returned empty" }
              } catch {
                Write-Warning "vswhere query failed: $_"
              }
            } else {
              Write-Warning "vswhere not found on runner"
            }
          }
          if (-not $installed) { Write-Warning 'No VSIXInstaller found or installation failed; continue and upload logs for diagnosis.' }

      - name: Build User Setup MSI
        id: build-user-interface-setup
        shell: cmd
        working-directory: .
        timeout-minutes: 10
        continue-on-error: true
        run: |
          devenv .\pdf-combine.sln ^
          /Build ${{ steps.get-build-type.outputs.build-type }} ^
          /Project pdf-combine-setup ^
          /Log InstallerBuild.log ^
          /Out InstallerBuild.log ^
          /NoSplash

      # send build log to github output
      - name: Upload Build Log
        id: upload-build-log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-user-installer-log
          path: |
            .\InstallerBuild.log
            .\**\InstallerBuild.log
          retention-days: 5

      - name: Upload Check
        id: upload-check
        if: ${{ steps.build-user-interface-setup.outcome != 'success' }}
        uses: actions/github-script@v8
        with:
          script: |
            core.setFailed('user-installer build failed, no sense continuing...')

      - name: Upload Artifact
        id: upload-installer
        if: ${{ steps.build-user-interface-setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-user-installer-artifact
          path: pdf-combine-setup\${{ steps.get-build-type.outputs.build-type }}\${{ steps.get-installer-filename.outputs.installer-filename }}
          retention-days: 5
